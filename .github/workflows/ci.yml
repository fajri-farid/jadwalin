name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Pasang dependensi
        run: pnpm install --frozen-lockfile

      - name: Cek TypeScript
        run: pnpm typecheck

      - name: Cek ESLint
        run: pnpm lint

      - name: Cek Format Prettier
        run: pnpm format:check

      - name: Jalankan Unit Test (Vitest)
        run: pnpm test

      - name: Uji Production Build Next.js
        run: pnpm build
